
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>School-Helper📝</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #f5f2eb;
  color: #49463f;
  font-family: Georgia, serif;
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

button:focus-visible, input:focus-visible,
textarea:focus-visible {
  outline: 2px solid #a99b82;
  outline-offset: 3px;
}

/* LOGIN */

.center {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
}

.login {
  width: min(390px, 100%);
  text-align: center;
}

.login h1 {
  font-size: 36px;
  font-weight: normal;
  margin-bottom: 45px;
}

.login label {
  display: block;
  margin-bottom: 15px;
  font-size: 17px;
}

.login input[type="text"],
.login input[type="password"] {
  width: 100%;
  padding: 15px;
  border: none;
  border-bottom: 1px solid #bdb5a8;
  background: transparent;
  text-align: center;
  font-size: 18px;
  outline: none;
}

.btn {
  background: #4b4941;
  color: white;
  padding: 13px 32px;
  border: none;
  transition: .2s;
}

.btn:hover { background: #777164; }

.login .btn { margin-top: 30px; }

.error {
  color: #a35d52;
  font-size: 13px;
  margin-top: 18px;
  min-height: 18px;
}

.verify {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: white;
  border: 1px solid #ded8ce;
  padding: 22px;
  margin-top: 20px;
}

.verify input {
  width: 22px;
  height: 22px;
  accent-color: #49463f;
}

/* MAIN */

#mainPage {
  min-height: 100vh;
  padding: 70px 20px;
  text-align: center;
}

.main-title {
  font-size: 34px;
  font-weight: normal;
  letter-spacing: 1px;
}

.main-subtitle {
  color: #9a9388;
  font-size: 12px;
  letter-spacing: 2px;
  margin-top: 15px;
  margin-bottom: 75px;
}

.menu {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 25px;
}

.menu-card {
  width: 240px;
  height: 220px;
  background: #fff;
  border: 1px solid #e6e0d6;
  color: #49463f;
  transition: .25s;
}

.menu-card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 25px #0000000b;
}

.menu-icon {
  font-size: 37px;
  display: block;
  margin-bottom: 18px;
}

.menu-card h2 {
  font-weight: normal;
  font-size: 22px;
}

/* PAGE HEADER */

.page {
  min-height: 100vh;
  padding: 30px 6%;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 40px;
}

.back {
  border: none;
  background: transparent;
  color: #777;
  font-size: 14px;
}

.header h1 {
  font-size: 29px;
  font-weight: normal;
}

/* MEMO */

.memo-layout {
  display: grid;
  grid-template-columns: 220px minmax(0, 650px);
  justify-content: center;
  gap: 35px;
}

.gallery {
  background: white;
  border: 1px solid #e8e1d7;
  padding: 20px;
  height: fit-content;
}

.gallery h3 {
  font-weight: normal;
  font-size: 19px;
  margin-top: 0;
}

.new-memo {
  width: 100%;
  padding: 12px;
  border: none;
  background: #4b4941;
  color: white;
  margin-bottom: 15px;
}

.memo-item {
  width: 100%;
  display: block;
  text-align: left;
  border: 1px solid transparent;
  background: #f7f5f0;
  color: #555;
  padding: 13px;
  margin-bottom: 8px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.memo-item.active {
  background: #eee9df;
  border-color: #c9beaa;
}

.paper {
  min-height: 580px;
  background-color: #fffdf6;
  background-image:
    repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 31px,
      #e9e3d8 32px
    );
  background-position: 0 105px;
  border: 1px solid #e6dfd1;
  box-shadow: 0 5px 20px #00000009;
  padding: 35px 40px;
}

.memo-title {
  width: 100%;
  border: none;
  border-bottom: 1px solid #d5ccbc;
  background: transparent;
  padding: 5px 0 18px;
  margin-bottom: 20px;
  font-size: 25px;
  color: #49463f;
  outline: none;
}

.memo-text {
  display: block;
  width: 100%;
  min-height: 400px;
  border: none;
  background: transparent;
  resize: none;
  outline: none;
  color: #49463f;
  font-size: 17px;
  line-height: 32px;
  font-family: Georgia, serif;
  overflow: hidden;
}

.save-status {
  text-align: right;
  font-size: 12px;
  color: #928b80;
  margin-top: 12px;
}

/* PICTURES */

.upload-area {
  max-width: 900px;
  margin: auto;
}

.upload-box {
  background: white;
  border: 1px dashed #c9c0b2;
  text-align: center;
  padding: 45px 20px;
}

.upload-box p {
  color: #8b857b;
  font-size: 14px;
}

.upload-btn {
  background: #4b4941;
  color: white;
  border: none;
  padding: 14px 35px;
}

.count {
  color: #938b80;
  font-size: 13px;
  margin-top: 20px;
}

.photo-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 20px;
  margin-top: 35px;
}

.photo-card {
  background: white;
  border: 1px solid #e8e1d7;
  padding: 10px;
  min-width: 0;
}

.photo-card img {
  width: 100%;
  height: 170px;
  object-fit: cover;
  display: block;
}

.photo-name {
  font-size: 12px;
  color: #777;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin: 12px 0;
}

.photo-card button {
  width: 100%;
  padding: 10px;
  border: none;
  background: #4b4941;
  color: white;
  margin-top: 6px;
}

.photo-card .delete {
  background: #eeeae3;
  color: #555;
}

/* MODAL */

.modal-bg {
  position: fixed;
  inset: 0;
  background: #00000055;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal {
  background: #fff;
  padding: 32px;
  width: min(370px, 100%);
  text-align: center;
}

.modal h2 {
  font-weight: normal;
  font-size: 22px;
}

.modal p {
  font-size: 14px;
  color: #777;
  line-height: 1.7;
}

.modal-buttons {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 25px;
}

.modal-buttons button {
  padding: 12px 25px;
  border: none;
  background: #4b4941;
  color: white;
}

.modal-buttons .cancel {
  background: #eeeae3;
  color: #49463f;
}

@media(max-width:650px) {
  .memo-layout { grid-template-columns: 1fr; }
  .gallery { order: 2; }
  .paper { padding: 25px 20px; }
  .page { padding: 20px; }
  .header h1 { font-size: 23px; }
}
</style>
</head>

<body>

<!-- STEP 1 -->

<section id="step1" class="center">
  <div class="login">
    <h1>Who are you?</h1>
    <label><b>[USERNAME]</b></label>
    <input id="answer1" type="text"
      placeholder="Your answer..." autocomplete="off">
    <button class="btn" onclick="checkAnswer(1)">Enter</button>
    <p id="error1" class="error"></p>
  </div>
</section>

<!-- STEP 2 -->

<section id="step2" class="center hidden">
  <div class="login">
    <h1>pasword</h1>
    <input id="answer2" type="password"
      placeholder="Your answer..." autocomplete="off">
    <button class="btn" onclick="checkAnswer(2)">Enter</button>
    <p id="error2" class="error"></p>
  </div>
</section>

<!-- STEP 3 -->

<section id="step3" class="center hidden">
  <div class="login">
    <h1>What is 🥜?</h1>
    <input id="answer3" type="text"
      placeholder="Your answer..." autocomplete="off">
    <button class="btn" onclick="checkAnswer(3)">Enter</button>
    <p id="error3" class="error"></p>
  </div>
</section>

<!-- STEP 4 -->

<section id="step4" class="center hidden">
  <div class="login">
    <h1>One last thing.</h1>

    <div class="verify">
      <span>Verify you're a human</span>
      <input type="checkbox" id="human">
    </div>

    <button class="btn" onclick="verifyHuman()">Continue</button>
    <p id="error4" class="error"></p>
  </div>
</section>

<!-- MAIN MENU -->

<section id="mainPage" class="hidden">
  <h1 class="main-title">School-Helper📝</h1>
  <p class="main-subtitle">Only for the Admin, me!💡🔧</p>

  <div class="menu">
    <button class="menu-card" onclick="openPage('memoPage')">
      <span class="menu-icon">✎</span>
      <h2>Memo</h2>
    </button>

    <button class="menu-card" onclick="openPage('picturePage')">
      <span class="menu-icon">▧</span>
      <h2>Uploaded Pictures</h2>
    </button>
  </div>
</section>

<!-- MEMO PAGE -->

<section id="memoPage" class="page hidden">
  <div class="header">
    <button class="back" onclick="openPage('mainPage')">← Back</button>
    <h1>Memo</h1>
    <span></span>
  </div>

  <div class="memo-layout">
    <aside class="gallery">
      <h3>Memo Gallery</h3>
      <button class="new-memo" onclick="createMemo()">
        + New Memo
      </button>
      <div id="memoGallery"></div>
    </aside>

    <div>
      <div class="paper">
        <input id="memoTitle" class="memo-title"
          placeholder="Untitled memo...">

        <textarea id="memoText" class="memo-text"
          placeholder="Write something..."></textarea>
      </div>

      <div id="saveStatus" class="save-status">
        Automatically saved
      </div>
    </div>
  </div>
</section>

<!-- PICTURE PAGE -->

<section id="picturePage" class="page hidden">
  <div class="header">
    <button class="back" onclick="openPage('mainPage')">← Back</button>
    <h1>Uploaded Pictures</h1>
    <span></span>
  </div>

  <div class="upload-area">
    <div class="upload-box">
      <button class="upload-btn"
        onclick="document.getElementById('fileInput').click()">
        My PC
      </button>

      <p>Select pictures from your computer.</p>

      <input id="fileInput" type="file"
        accept="image/*" multiple hidden>

      <div id="photoCount" class="count">0 / 20 pictures</div>
    </div>

    <div id="photoGrid" class="photo-grid"></div>
  </div>
</section>

<!-- POPUP -->

<div id="modalBg" class="modal-bg hidden">
  <div class="modal">
    <h2 id="modalTitle">Notice</h2>
    <p id="modalMessage"></p>

    <div class="modal-buttons">
      <button id="modalYes">Yes</button>
      <button id="modalCancel" class="cancel">Cancel</button>
    </div>
  </div>
</div>

<script>

/* LOGIN SYSTEM */

const answers = {
  1: "26s.park",
  2: "150809",
  3: "pnbt"
};

function checkAnswer(step) {
  const input = document.getElementById("answer" + step);
  const error = document.getElementById("error" + step);

  if (input.value.trim() === answers[step]) {
    document.getElementById("step" + step).classList.add("hidden");
    document.getElementById("step" + (step + 1)).classList.remove("hidden");
    error.textContent = "";
  } else {
    error.textContent = "Incorrect answer. Try again.";
    input.value = "";
    input.focus();
  }
}

document.querySelectorAll(".login input:not([type=checkbox])")
.forEach(input => {
  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      const step = Number(input.id.replace("answer", ""));
      checkAnswer(step);
    }
  });
});

function verifyHuman() {
  if (!document.getElementById("human").checked) {
    document.getElementById("error4").textContent =
      "Please verify you're a human.";
    return;
  }

  document.getElementById("step4").classList.add("hidden");
  document.getElementById("mainPage").classList.remove("hidden");
}

/* NAVIGATION */

function openPage(id) {
  ["mainPage", "memoPage", "picturePage"].forEach(page => {
    document.getElementById(page).classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

  if (id === "memoPage") renderMemos();
  if (id === "picturePage") renderPhotos();
}

/* POPUP SYSTEM */

function popup(title, message) {
  return new Promise(resolve => {
    const bg = document.getElementById("modalBg");

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalMessage").textContent = message;

    bg.classList.remove("hidden");

    document.getElementById("modalYes").onclick = () => {
      bg.classList.add("hidden");
      resolve(true);
    };

    document.getElementById("modalCancel").onclick = () => {
      bg.classList.add("hidden");
      resolve(false);
    };
  });
}

/* MEMO STORAGE */

function loadSavedMemos() {
  try {
    const saved = JSON.parse(localStorage.getItem("myMemos") || "[]");
    return Array.isArray(saved) ? saved : [];
  } catch {
    return [];
  }
}

let memos = loadSavedMemos();
let activeMemo = null;
let askingSheet = false;

function saveMemos() {
  try {
    localStorage.setItem("myMemos", JSON.stringify(memos));
    document.getElementById("saveStatus").textContent =
      "✓ Automatically saved";
  } catch {
    document.getElementById("saveStatus").textContent =
      "Unable to save memo";
  }
}

function createMemo(initialText = "") {
  const memo = {
    id: crypto.randomUUID(),
    title: "",
    text: initialText
  };

  memos.unshift(memo);
  activeMemo = memo.id;
  saveMemos();
  renderMemos();
}

function renderMemos() {
  if (memos.length === 0) {
    createMemo();
    return;
  }

  renderGallery();
  loadActiveMemo();
}

function renderGallery() {
  const gallery = document.getElementById("memoGallery");
  gallery.replaceChildren();

  memos.forEach(memo => {
    const button = document.createElement("button");

    button.className = "memo-item" +
      (memo.id === activeMemo ? " active" : "");

    button.textContent = memo.title || "Untitled memo";

    button.onclick = () => {
      activeMemo = memo.id;
      renderGallery();
      loadActiveMemo();
    };

    gallery.appendChild(button);
  });
}

function loadActiveMemo() {
  const memo = memos.find(item => item.id === activeMemo);
  if (!memo) return;

  document.getElementById("memoTitle").value = memo.title;
  document.getElementById("memoText").value = memo.text;
  resizeMemo();
}

function updateMemo() {
  const memo = memos.find(item => item.id === activeMemo);
  if (!memo) return;

  memo.title = document.getElementById("memoTitle").value;
  memo.text = document.getElementById("memoText").value;

  saveMemos();
  renderGallery();
  resizeMemo();
}

document.getElementById("memoTitle").addEventListener("input", updateMemo);

function resizeMemo() {
  const textarea = document.getElementById("memoText");
  textarea.style.height = "auto";
  textarea.style.height = Math.max(400, textarea.scrollHeight) + "px";
}

/* 37 CHARACTERS = NEW SHEET */

document.getElementById("memoText").addEventListener("input", async function() {
  updateMemo();

  const memo = memos.find(item => item.id === activeMemo);

  if (!memo || memo.text.length <= 37 || askingSheet) return;

  askingSheet = true;

  const accepted = await popup(
    "Use another sheet?",
    "Your memo has more than 37 characters. Would you like to continue on another sheet?"
  );

  const current = memos.find(item => item.id === activeMemo);

  if (accepted && current) {
    const overflow = current.text.slice(37);
    current.text = current.text.slice(0, 37);

    const next = {
      id: crypto.randomUUID(),
      title: "",
      text: overflow
    };

    memos.unshift(next);
    activeMemo = next.id;

    saveMemos();
    renderMemos();
  }

  askingSheet = false;
});

/* INITIAL MEMO */

if (memos.length === 0) {
  memos.push({
    id: crypto.randomUUID(),
    title: "",
    text: ""
  });

  localStorage.setItem("myMemos", JSON.stringify(memos));
}

/* IMAGE DATABASE */

let db = null;

const dbReady = new Promise((resolve, reject) => {
  const request = indexedDB.open("MyPrivatePictures", 1);

  request.onupgradeneeded = event => {
    const database = event.target.result;

    if (!database.objectStoreNames.contains("photos")) {
      database.createObjectStore("photos", {
        keyPath: "id",
        autoIncrement: true
      });
    }
  };

  request.onsuccess = event => {
    db = event.target.result;
    resolve(db);
  };

  request.onerror = () => reject(request.error);
});

function getPhotos() {
  return new Promise(async (resolve, reject) => {
    try {
      await dbReady;

      const transaction = db.transaction("photos", "readonly");
      const request = transaction.objectStore("photos").getAll();

      request.onsuccess = () => {
        resolve(request.result.sort((a, b) => a.id - b.id));
      };

      request.onerror = () => reject(request.error);
    } catch (error) {
      reject(error);
    }
  });
}

function addPhoto(photo) {
  return new Promise(async (resolve, reject) => {
    try {
      await dbReady;

      const transaction = db.transaction("photos", "readwrite");
      transaction.objectStore("photos").add(photo);

      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    } catch (error) {
      reject(error);
    }
  });
}

function removePhoto(id) {
  return new Promise(async (resolve, reject) => {
    try {
      await dbReady;

      const transaction = db.transaction("photos", "readwrite");
      transaction.objectStore("photos").delete(id);

      transaction.oncomplete = () => resolve();
      transaction.onerror = () => reject(transaction.error);
    } catch (error) {
      reject(error);
    }
  });
}

/* IMAGE UPLOAD */

function readImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();

    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);

    reader.readAsDataURL(file);
  });
}

document.getElementById("fileInput").addEventListener("change", async function(event) {
  const files = Array.from(event.target.files || [])
    .filter(file => file.type.startsWith("image/"));

  for (const file of files) {
    try {
      let photos = await getPhotos();

      if (photos.length >= 20) {
        const accepted = await popup(
          "Warning",
          "Should we delete first image?"
        );

        if (!accepted) continue;

        await removePhoto(photos[0].id);
      }

      const data = await readImage(file);

      await addPhoto({
        name: file.name,
        data: data,
        created: Date.now()
      });

      await renderPhotos();

    } catch (error) {
      alert("Something went wrong while uploading the picture.");
    }
  }

  event.target.value = "";
});

/* IMAGE GALLERY */

async function renderPhotos() {
  await dbReady;

  const photos = await getPhotos();
  const grid = document.getElementById("photoGrid");

  grid.replaceChildren();

  document.getElementById("photoCount").textContent =
    photos.length + " / 20 pictures";

  photos.forEach(photo => {
    const card = document.createElement("div");
    card.className = "photo-card";

    const image = document.createElement("img");
    image.src = photo.data;
    image.alt = photo.name;

    const name = document.createElement("div");
    name.className = "photo-name";
    name.textContent = photo.name;

    const copy = document.createElement("button");
    copy.textContent = "Copy";
    copy.onclick = () => copyImage(photo);

    const del = document.createElement("button");
    del.className = "delete";
    del.textContent = "Delete";

    del.onclick = async () => {
      await removePhoto(photo.id);
      renderPhotos();
    };

    card.append(image, name, copy, del);
    grid.appendChild(card);
  });
}

/* COPY IMAGE TO CLIPBOARD */

async function copyImage(photo) {
  try {
    if (!navigator.clipboard || !window.ClipboardItem) {
      throw new Error("Clipboard unavailable");
    }

    const response = await fetch(photo.data);
    const blob = await response.blob();

    await navigator.clipboard.write([
      new ClipboardItem({
        [blob.type]: blob
      })
    ]);

    alert("Copied! Now press Ctrl + V on the other PC.");

  } catch (error) {
    alert("Could not copy the image. Please use HTTPS and allow clipboard access.");
  }
}

</script>
</body>
</html>
